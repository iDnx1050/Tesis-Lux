name: Escaneo de vulnerabilidades (OWASP ZAP)

# Escaneo pasivo (ZAP Baseline) del sitio en producción: recorre el sitio y
# analiza las respuestas sin enviar ataques. Corre el día 1 de cada mes y se
# puede lanzar a mano desde la pestaña Actions. El reporte (HTML, JSON y
# Markdown) queda como artefacto del workflow: es la evidencia de los escaneos
# periódicos que pide Transbank.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP Baseline
    runs-on: ubuntu-latest

    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://vedetoslux.cl'
          # Sin issue automático: en un repositorio público dejaría los
          # hallazgos a la vista de cualquiera.
          allow_issue_writing: false
          # El spider no envía formularios por POST, para no crear reservas
          # ni solicitudes falsas en producción.
          cmd_options: '-z "-config spider.postform=false"'
          artifact_name: zap-report
